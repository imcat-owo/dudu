name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Select Xcode 26.6 (iOS 26 SDK)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Xcode / SDK diagnostics
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" | head -5

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        # --prod: keep expo-dev-client (devDependency) out of the release
        # build so the dev launcher / EX_DEV_MENU_ENABLED never ships in
        # the IPA. Local dev still gets it via a normal `pnpm install`.
        run: pnpm install --frozen-lockfile --prod
        working-directory: .

      - name: Expo prebuild (generate ios/)
        run: pnpm exec expo prebuild --platform ios --clean
        env:
          CI: 1
          # Build Hermes from source (2026-10-06): prebuild runs `pod install`
          # internally, so the flag must be set here (not only on the later
          # CocoaPods step) for hermes-engine to compile from the pinned tag
          # instead of downloading the prebuilt tarball (expo#44606).
          RCT_BUILD_HERMES_FROM_SOURCE: "true"

      - name: Install CocoaPods
        env:
          # Build Hermes from source (2026-10-06): the prebuilt hermes-engine
          # binary shipped with RN 0.81.5 has stale VM-layout assumptions that
          # crash on iOS 26/27 (expo#44606). Building from the pinned tag
          # (sdks/.hermesversion) with the current Xcode avoids the bad binary.
          RCT_BUILD_HERMES_FROM_SOURCE: "true"
        run: |
          cd ios
          pod install --repo-update

      - name: Fix EXConstants script path (pnpm workaround)
        run: |
          # CocoaPods sets PODS_TARGET_SRCROOT to ios/Pods/../../ (= apps/mobile)
          # for expo modules under pnpm, so the EXConstants "Generate app.config"
          # script phase points at a non-existent path and the build fails.
          # Patch the generated Pods project to use the absolute script path.
          ROOT=$(cd ../.. && pwd)
          EC_DIR=$(find "$ROOT/node_modules/.pnpm" -maxdepth 2 -type d -name "expo-constants@*" | head -1)/node_modules/expo-constants
          EC_SCRIPT="$EC_DIR/scripts/get-app-config-ios.sh"
          if [ ! -f "$EC_SCRIPT" ]; then
            echo "expo-constants script not found at $EC_SCRIPT"
            exit 1
          fi
          echo "Patching EXConstants script phase to: $EC_SCRIPT"
          sed -i '' 's|$PODS_TARGET_SRCROOT/../scripts/get-app-config-ios.sh|'"$EC_SCRIPT"'|g' ios/Pods/Pods.xcodeproj/project.pbxproj
          grep -c "get-app-config-ios.sh" ios/Pods/Pods.xcodeproj/project.pbxproj

      - name: Build with xcodebuild (unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found. Contents:"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          APPS=( *.app )
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "Expected exactly one .app, found ${#APPS[@]}. Contents:"
            ls -la
            exit 1
          fi
          APP="${APPS[0]}"
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r OpenMuse-unsigned.ipa Payload
          ls -lh OpenMuse-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-unsigned-ipa
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/OpenMuse-unsigned.ipa
          retention-days: 14
