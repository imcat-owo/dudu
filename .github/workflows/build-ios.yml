name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Select Xcode 26.6 (iOS 26 SDK)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Xcode / SDK diagnostics
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" | head -5

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Expo prebuild (generate ios/)
        run: pnpm exec expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build with xcodebuild (unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found. Contents:"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          APPS=( *.app )
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "Expected exactly one .app, found ${#APPS[@]}. Contents:"
            ls -la
            exit 1
          fi
          APP="${APPS[0]}"
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r OpenMuse-unsigned.ipa Payload
          ls -lh OpenMuse-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-unsigned-ipa
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/OpenMuse-unsigned.ipa
          retention-days: 14
