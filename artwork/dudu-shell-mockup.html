<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘟嘟 App 空壳（静态 mockup，只有画面没有功能）</title>
<!--
  嘟嘟 App 主界面空壳 v1 —— 静态展示，无功能。
  设计口径：穹妹灰调手绘风 / 双头像气泡一左一右 / 小气泡小字号精致风 /
  可爱不油腻文案 / 全局无 emoji / SVG 圆润 Q 版。
  头像为 SVG 占位，正式美术（穹妹头像/小恶魔皮肤）后续替换。
-->
<style>
:root{
  --bg:#FAF9F6; --card:#FFFFFF; --ink:#3D3A33; --ink-soft:#6E695C;
  --muted:#8A8578; --faint:#B9B2A2; --line:#E7E2D5; --line-soft:#EFECE4;
  --accent:#D97757; --accent-deep:#C15F3C; --bubble-ai:#FFFFFF; --bubble-me:#EFE9DC;
  --tab-bg:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:#EDEAE3;display:flex;justify-content:center;align-items:flex-start;
  padding:28px 12px;font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.cap{text-align:center;font-size:13px;color:var(--muted);margin:0 0 10px}
.phone{width:340px;background:var(--bg);border-radius:40px;border:1px solid var(--line);
  overflow:hidden;box-shadow:0 12px 34px rgba(61,58,51,.12);display:flex;flex-direction:column;height:720px}
.status{display:flex;justify-content:space-between;padding:14px 24px 4px;font-size:12px;color:var(--ink-soft)}
.head{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;border-bottom:1px solid var(--line-soft)}
.head .name{font-size:16px;font-weight:700;color:var(--ink)}
.head .sub{font-size:11px;color:var(--muted);margin-top:1px}
.head .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FB069;margin-right:4px}
.head .sp{flex:1}
.iconbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.body{flex:1;overflow:hidden;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.day{align-self:center;font-size:11px;color:var(--faint);background:var(--line-soft);
  border-radius:999px;padding:3px 12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.me{justify-content:flex-end}
.av{width:32px;height:32px;flex:none;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#fff}
.bubble{font-size:13.5px;line-height:1.65;color:var(--ink);padding:9px 13px;max-width:72%;
  box-shadow:0 1px 4px rgba(61,58,51,.05)}
.msg.ai .bubble{background:var(--bubble-ai);border:1px solid var(--line-soft);border-radius:4px 16px 16px 16px}
.msg.me .bubble{background:var(--bubble-me);border-radius:16px 16px 4px 16px}
/* thinking 小按钮 */
.think{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--ink-soft);
  box-shadow:0 2px 10px rgba(61,58,51,.06)}
.think .ast{color:var(--accent-deep);font-size:14px;display:inline-block;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.think .shimmer{background:linear-gradient(100deg,var(--faint) 30%,var(--ink-soft) 50%,var(--faint) 70%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.think .chev{color:var(--faint);font-size:12px}
/* 语音气泡 */
.voice{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line-soft);
  border-radius:4px 16px 16px 16px;padding:9px 13px;max-width:72%;box-shadow:0 1px 4px rgba(61,58,51,.05)}
.voice .bars{display:flex;align-items:center;gap:2.5px;height:18px}
.voice .bars i{width:3px;border-radius:2px;background:var(--faint)}
.voice .dur{font-size:11px;color:var(--muted)}
/* 底部输入 */
.composer{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg)}
.pill{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;font-size:13.5px;color:var(--faint)}
.send{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center}
/* tab bar */
.tabs{display:flex;background:var(--tab-bg);border-top:1px solid var(--line-soft);padding:8px 0 18px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint)}
.tab.on{color:var(--accent-deep)}
.note{max-width:340px;margin:14px auto 0;font-size:12px;color:var(--muted);line-height:1.8;text-align:center}
</style>
</head>
<body>
<div>
<p class="cap">嘟嘟 App 空壳 v1 —— 只有画面，没有功能</p>
<div class="phone">
  <div class="status"><span>9:41</span><span>5G</span></div>
  <div class="head">
    <span class="av" aria-label="嘟嘟头像">
      <svg viewBox="0 0 32 32" width="32" height="32">
        <circle cx="16" cy="16" r="15" fill="#EFE9DC"/>
        <path d="M4 18c0-8 5-13 12-13s12 5 12 13c0 2-1 3-2 3-2-4-5-6-10-6s-8 2-10 6c-1 0-2-1-2-3z" fill="#8A8578"/>
        <circle cx="16" cy="18" r="8.5" fill="#F7EFE6"/>
        <circle cx="12.8" cy="17.5" r="1.4" fill="#3D3A33"/>
        <circle cx="19.2" cy="17.5" r="1.4" fill="#3D3A33"/>
        <path d="M13.8 21.5c1.4 1.2 3 1.2 4.4 0" stroke="#3D3A33" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="10.8" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
        <ellipse cx="21.2" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
      </svg>
    </span>
    <span><div class="name">嘟嘟</div><div class="sub"><span class="dot"></span>在线，陪你呢</div></span>
    <span class="sp"></span>
    <span class="iconbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg></span>
  </div>
  <div class="body">
    <span class="day">今天</span>
    <div class="msg ai">
      <span class="av"><svg viewBox="0 0 32 32" width="32" height="32">
        <circle cx="16" cy="16" r="15" fill="#EFE9DC"/>
        <path d="M4 18c0-8 5-13 12-13s12 5 12 13c0 2-1 3-2 3-2-4-5-6-10-6s-8 2-10 6c-1 0-2-1-2-3z" fill="#8A8578"/>
        <circle cx="16" cy="18" r="8.5" fill="#F7EFE6"/>
        <circle cx="12.8" cy="17.5" r="1.4" fill="#3D3A33"/>
        <circle cx="19.2" cy="17.5" r="1.4" fill="#3D3A33"/>
        <path d="M13.8 21.5c1.4 1.2 3 1.2 4.4 0" stroke="#3D3A33" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="10.8" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
        <ellipse cx="21.2" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
      </svg></span>
      <span class="bubble">早呀，今天想先做哪件小事？</span>
    </div>
    <div class="msg me">
      <span class="bubble">帮我看看这周有哪些安排</span>
      <span class="av"><svg viewBox="0 0 32 32" width="32" height="32">
        <circle cx="16" cy="16" r="15" fill="#E3E8F0"/>
        <circle cx="16" cy="13" r="5" fill="#F7EFE6"/>
        <path d="M8 26c1-5 4-7 8-7s7 2 8 7" fill="#B9C4D6"/>
        <circle cx="14" cy="12.5" r="1.1" fill="#3D3A33"/>
        <circle cx="18" cy="12.5" r="1.1" fill="#3D3A33"/>
        <path d="M14.5 15.5c1 0.8 2 0.8 3 0" stroke="#3D3A33" stroke-width="1" fill="none" stroke-linecap="round"/>
      </svg></span>
    </div>
    <div class="think"><span class="ast">✳</span><span class="shimmer">想想…</span><span class="chev">看看在想什么 ›</span></div>
    <div class="msg ai">
      <span class="av"><svg viewBox="0 0 32 32" width="32" height="32">
        <circle cx="16" cy="16" r="15" fill="#EFE9DC"/>
        <path d="M4 18c0-8 5-13 12-13s12 5 12 13c0 2-1 3-2 3-2-4-5-6-10-6s-8 2-10 6c-1 0-2-1-2-3z" fill="#8A8578"/>
        <circle cx="16" cy="18" r="8.5" fill="#F7EFE6"/>
        <circle cx="12.8" cy="17.5" r="1.4" fill="#3D3A33"/>
        <circle cx="19.2" cy="17.5" r="1.4" fill="#3D3A33"/>
        <path d="M13.8 21.5c1.4 1.2 3 1.2 4.4 0" stroke="#3D3A33" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="10.8" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
        <ellipse cx="21.2" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
      </svg></span>
      <span class="bubble">这周三件：周三晚上听歌房有你攒的歌单，周五是我们的 100 天，周日下午空着，要不要排点好玩的？</span>
    </div>
    <div class="msg ai">
      <span class="av"><svg viewBox="0 0 32 32" width="32" height="32">
        <circle cx="16" cy="16" r="15" fill="#EFE9DC"/>
        <path d="M4 18c0-8 5-13 12-13s12 5 12 13c0 2-1 3-2 3-2-4-5-6-10-6s-8 2-10 6c-1 0-2-1-2-3z" fill="#8A8578"/>
        <circle cx="16" cy="18" r="8.5" fill="#F7EFE6"/>
        <circle cx="12.8" cy="17.5" r="1.4" fill="#3D3A33"/>
        <circle cx="19.2" cy="17.5" r="1.4" fill="#3D3A33"/>
        <path d="M13.8 21.5c1.4 1.2 3 1.2 4.4 0" stroke="#3D3A33" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="10.8" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
        <ellipse cx="21.2" cy="20" rx="1.6" ry="1" fill="#E8B4A0" opacity=".7"/>
      </svg></span>
      <span class="voice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#C15F3C"><path d="M8 5v14l11-7z"/></svg>
        <span class="bars"><i style="height:6px"></i><i style="height:12px"></i><i style="height:8px"></i><i style="height:15px"></i><i style="height:9px"></i><i style="height:13px"></i><i style="height:7px"></i><i style="height:11px"></i></span>
        <span class="dur">12''</span>
      </span>
    </div>
  </div>
  <div class="composer">
    <span class="iconbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span class="pill">跟嘟嘟说点什么…</span>
    <span class="iconbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <span class="send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
  </div>
  <div class="tabs">
    <span class="tab on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>聊天</span>
    <span class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>空间</span>
    <span class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>听歌</span>
    <span class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg>我的</span>
  </div>
</div>
<p class="note">双头像一左一右 · 小气泡小字号 · thinking 小按钮 · 微信式语音气泡<br>头像为 SVG 占位，正式美术后续替换</p>
</div>
</body>
</html>
